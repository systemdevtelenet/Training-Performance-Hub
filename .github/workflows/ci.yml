name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor-trainingHub

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Run existing checks
        run: |
          npx ts-node --compiler-options '{"module":"CommonJS"}' tests/role-resolution.test.ts
          npx ts-node --compiler-options '{"module":"CommonJS"}' tests/deleted-trainers-table.test.ts

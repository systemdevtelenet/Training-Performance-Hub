services:
  app:
    image: ${CONTAINER_IMAGE:-ghcr.io/systemdevtelenet/training-performance-hub}:${IMAGE_TAG:-latest}
    container_name: training-performance-hub
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

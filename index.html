<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Performance Hub</title>
  <base target="_top">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Tailwind & Claymorphism Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#eef2f6] font-['Lexend'] text-[#363435] m-0 p-0 antialiased">
  <div class="w-full max-w-full m-0 px-6 py-4 box-border">
    
    <!-- Header Layout -->
    <div class="flex flex-col sm:flex-row justify-between items-center bg-white/85 px-4 py-2 rounded-xl mb-3 shadow-sm border border-slate-200">
      <div class="mb-2 sm:mb-0 text-center sm:text-left">
        <h1 class="text-base sm:text-lg font-bold text-[#363435] leading-tight">Training Performance Hub</h1>
        <p class="text-xs text-slate-500 mt-0.5">Cebu Tele-Net Operations Analytics</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button class="action-btn" id="refresh-btn" onclick="refreshDashboardData()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Refresh Data</span>
        </button>
        <button class="action-btn" id="export-summary-btn" onclick="exportExecutiveSummary()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span>Export Summary</span>
        </button>
        <button class="action-btn" onclick="window.print()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          <span>Print / PDF</span>
        </button>
        <span class="live-badge">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Live Systems
        </span>
      </div>
    </div>

    <!-- Main Navigation Bar -->
    <div class="tab-nav-container flex bg-[#eef2f6] p-2.5 rounded-2xl mb-6 gap-3 relative shadow-[9px_9px_16px_#d1d9e6,-9px_-9px_16px_#ffffff]">
      <div class="nav-item-wrapper relative flex-grow">
        <button class="tab-btn active" onclick="switchTab('summary')">Executive Summary</button>
        <div class="submenu-container">
          <button class="submenu-btn" onclick="switchTab('ai-report')">AI Insights</button>
          <button class="submenu-btn" onclick="switchTab('analytics')">Analytics Trends</button>
        </div>
      </div>

      <!-- Single Trainees Navigation Button -->
      <div class="nav-item-wrapper relative flex-grow">
        <button class="tab-btn" onclick="switchTab('trainees')">Trainees</button>
      </div>

      <div class="nav-item-wrapper relative flex-grow">
        <button class="tab-btn" onclick="switchTab('trainers')">Trainers</button>
        <div class="submenu-container">
          <button class="submenu-btn" onclick="switchTab('trainers')">Directory</button>
          <button class="submenu-btn" onclick="switchTab('trainer-attendance')">Attendance</button>
          <button class="submenu-btn" onclick="switchTab('trainer-reliability')">Reliability</button>
        </div>
      </div>
    </div>
  
    <!-- Filter Bar -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 bg-[#eef2f6] p-5 rounded-2xl mb-6 shadow-[inset_5px_5px_10px_#d1d9e6,inset_-5px_-5px_10px_#ffffff]">
      <div class="filter-group flex flex-col flex-grow">
        <label for="filter-quarter" class="text-[0.7rem] font-semibold uppercase text-slate-500 mb-1.5">Quarter Filter</label>
        <select id="filter-quarter" onchange="applyFilters()">
          <option value="ALL">All Quarters</option>
        </select>
      </div>
      <div class="filter-group flex flex-col flex-grow">
        <label for="filter-month" class="text-[0.7rem] font-semibold uppercase text-slate-500 mb-1.5">Month Filter</label>
        <select id="filter-month" onchange="applyFilters()">
          <option value="ALL">All Months</option>
        </select>
      </div>
      <div class="filter-group flex flex-col flex-grow">
        <label for="filter-account" class="text-[0.7rem] font-semibold uppercase text-slate-500 mb-1.5">Client Account</label>
        <select id="filter-account" onchange="applyFilters()">
          <option value="ALL">All Client Accounts</option>
        </select>
      </div>
      <div class="filter-group search-group flex flex-col flex-grow">
        <label for="search-query" class="text-[0.7rem] font-semibold uppercase text-slate-500 mb-1.5">Search Trainee / Batch / Trainer</label>
        <div class="search-input-wrapper relative flex items-center">
          <svg class="search-icon absolute left-3 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="search-query" class="pl-9" placeholder="Type name or batch..." oninput="applyFiltersDebounced()">
        </div>
      </div>
    </div>

    <!-- Main Panel Body -->
    <div id="breakdown-panel" class="panel-body">Loading UI Components...</div>
  </div>

  <!-- Modal for Chart Zoom / Details -->
  <div id="chartModal" class="chart-modal fixed inset-0 z-[10000] hidden items-center justify-center bg-black/50" onclick="closeChartModal(event)">
    <div class="chart-modal-content relative bg-[#eef2f6] p-6 rounded-3xl w-[90%] max-w-[1000px] shadow-[16px_16px_32px_#d1d9e6,-16px_-16px_32px_#ffffff]" onclick="event.stopPropagation()">
      <span class="chart-modal-close absolute top-3.5 right-5 text-2xl font-bold cursor-pointer text-slate-600" onclick="closeChartModal()">&times;</span>
      <div id="chartModalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
